<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能托管助手 - 登录</title>
    <style>
        /* --- 全局样式 --- */
        :root {
            --primary-color: #07c160;
            --teacher-color: #667eea;
            --parent-color: #52c41a;
            --bg-color: #f5f7fa;
            --text-main: #333;
            --text-sub: #999;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-shell {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 顶部装饰 */
        .header-decor {
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .logo-icon {
            font-size: 72px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .app-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .app-slogan {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 主卡片区 */
        .main-card {
            flex: 1;
            background: #fff;
            border-radius: 28px 28px 0 0;
            padding: 35px 25px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15);
        }

        .welcome-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 8px;
            text-align: center;
        }

        .welcome-sub {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 35px;
            text-align: center;
        }

        /* 身份选择卡片 - 双色设计 */
        .role-cards {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
        }

        .role-card {
            border-radius: 18px;
            padding: 22px 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .role-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .role-card:active {
            transform: scale(0.98);
        }

        /* 老师卡片 - 紫色系 */
        .role-card.teacher {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }

        .role-card.teacher:hover {
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.45);
            transform: translateY(-2px);
        }

        /* 家长卡片 - 绿色系 */
        .role-card.parent {
            background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%);
            box-shadow: 0 8px 25px rgba(82, 196, 26, 0.35);
        }

        .role-card.parent:hover {
            box-shadow: 0 12px 35px rgba(82, 196, 26, 0.45);
            transform: translateY(-2px);
        }

        .role-icon {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-right: 16px;
            backdrop-filter: blur(5px);
        }

        .role-info {
            flex: 1;
        }

        .role-info h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #fff;
            font-weight: 600;
        }

        .role-info p {
            margin: 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
        }

        .role-arrow {
            color: rgba(255, 255, 255, 0.7);
            font-size: 22px;
            font-weight: bold;
        }

        /* 提示文字 */
        .tips {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.8;
        }

        .tips a {
            color: #576b95;
            text-decoration: none;
        }

        /* 微信授权弹窗 - 仿微信原生样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.show {
            display: flex;
        }

        .wechat-auth-modal {
            background: #fff;
            width: 85%;
            max-width: 300px;
            border-radius: 12px;
            overflow: hidden;
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .wechat-auth-header {
            background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
            padding: 28px 20px;
            text-align: center;
            color: #fff;
        }

        .wechat-logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .wechat-auth-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .wechat-auth-subtitle {
            font-size: 12px;
            opacity: 0.85;
        }

        .wechat-auth-body {
            padding: 24px 20px;
            text-align: center;
        }

        .auth-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .phone-box {
            background: #f7f7f7;
            border-radius: 8px;
            padding: 14px;
            font-size: 22px;
            font-weight: 600;
            color: #333;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .phone-tip {
            font-size: 12px;
            color: #999;
        }

        .wechat-auth-footer {
            display: flex;
            border-top: 1px solid #e8e8e8;
        }

        .wechat-auth-footer button {
            flex: 1;
            height: 50px;
            border: none;
            background: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .wechat-auth-footer button:active {
            background: #f5f5f5;
        }

        .wechat-auth-footer button:first-child {
            border-right: 1px solid #e8e8e8;
            color: #333;
        }

        .wechat-auth-footer button:last-child {
            color: #07c160;
            font-weight: 500;
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            z-index: 9999;
            display: none;
            max-width: 280px;
            text-align: center;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 15px;
            color: var(--text-sub);
        }

        /* 失败弹窗 */
        .error-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .error-modal.show {
            display: flex;
        }

        .error-content {
            background: #fff;
            width: 85%;
            max-width: 320px;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .error-btn {
            width: 100%;
            height: 44px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        /* 成功弹窗 */
        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .success-modal.show {
            display: flex;
        }

        .success-content {
            background: #fff;
            width: 85%;
            max-width: 320px;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        .success-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .success-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .success-btn {
            width: 100%;
            height: 44px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="app-shell">

        <div id="toast">提示信息</div>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">正在登录...</div>
        </div>

        <div class="header-decor">
            <div class="logo-icon">🎒</div>
            <div class="app-name">智能托管助手</div>
            <div class="app-slogan">让接送更安心</div>
        </div>

        <div class="main-card">
            <div class="welcome-text">选择您的身份</div>
            <div class="welcome-sub">首次使用将自动为您创建账号</div>

            <div class="role-cards">
                <!-- 老师卡片 -->
                <div class="role-card teacher" onclick="handleRoleClick('teacher')">
                    <div class="role-icon">👨‍🏫</div>
                    <div class="role-info">
                        <h3>我是老师</h3>
                        <p>管理班级、考勤记录、作业归档</p>
                    </div>
                    <span class="role-arrow">›</span>
                </div>

                <!-- 家长卡片 -->
                <div class="role-card parent" onclick="handleRoleClick('parent')">
                    <div class="role-icon">👨‍👩‍👧</div>
                    <div class="role-info">
                        <h3>我是家长</h3>
                        <p>查看孩子动态、下载作业报告</p>
                    </div>
                    <span class="role-arrow">›</span>
                </div>
            </div>

            <div class="tips">
                登录即表示您已阅读并同意<br>
                <a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
            </div>
        </div>

    </div>

    <!-- 微信授权弹窗 - 仿微信原生样式 -->
    <div class="modal-overlay" id="authModal">
        <div class="wechat-auth-modal">
            <div class="wechat-auth-header">
                <div class="wechat-logo">📨</div>
                <div class="wechat-auth-title">授权手机号</div>
                <div class="wechat-auth-subtitle">智能托管助手</div>
            </div>
            <div class="wechat-auth-body">
                <div class="auth-desc">该小程序将获取你绑定的手机号</div>
                <div class="phone-box" id="phoneDisplay">138****8000</div>
                <div class="phone-tip">仅用于登录验证</div>
            </div>
            <div class="wechat-auth-footer">
                <button onclick="denyAuth()">拒绝</button>
                <button onclick="allowAuth()">允许</button>
            </div>
        </div>
    </div>

    <!-- 家长匹配失败弹窗 -->
    <div class="error-modal" id="errorModal">
        <div class="error-content">
            <div class="error-icon">😔</div>
            <div class="error-title">未找到学生档案</div>
            <div class="error-desc">
                您的手机号尚未被托管老师录入系统。<br>
                请联系老师将您的手机号添加到学生信息中。
            </div>
            <button class="error-btn" onclick="closeErrorModal()">我知道了</button>
        </div>
    </div>

    <!-- 老师注册成功弹窗 -->
    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="success-icon">🎉</div>
            <div class="success-title">账号创建成功！</div>
            <div class="success-desc" id="successDesc">
                已为您创建托管机构账号<br>
                建议先去设置中完善机构信息
            </div>
            <button class="success-btn" onclick="goToTeacherHome()">进入首页</button>
        </div>
    </div>

    <script>
        // 模拟数据：已绑定的家长手机号
        const registeredParents = {
            '13812345678': { studentName: '王小明', studentId: 1 },
            '13800138000': { studentName: '谭圣涵', studentId: 2 },
            '13666666666': { studentName: '李梓诺', studentId: 3 }
        };

        // 模拟数据：已注册的老师
        const registeredTeachers = {
            '13900001111': { name: '李老师', orgName: '阳光托管中心' }
        };

        // 当前选择的角色
        let currentRole = '';
        // 模拟手机号
        let mockPhone = '13800138000';
        // 是否是新注册的老师
        let isNewTeacher = false;

        // 点击身份卡片
        function handleRoleClick(role) {
            currentRole = role;

            // 生成随机手机号用于演示
            if (role === 'teacher') {
                // 老师: 50%概率是新用户
                mockPhone = Math.random() > 0.5 ? '13900001111' : '139' + Math.floor(Math.random() * 100000000).toString().padStart(8, '0');
            } else {
                // 家长: 使用已注册的手机号
                mockPhone = '13800138000';
            }

            // 显示授权弹窗
            document.getElementById('authModal').classList.add('show');
            const maskedPhone = mockPhone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
            document.getElementById('phoneDisplay').innerText = maskedPhone;
        }

        // 拒绝授权
        function denyAuth() {
            document.getElementById('authModal').classList.remove('show');
            showToast('您已取消授权');
        }

        // 允许授权
        function allowAuth() {
            document.getElementById('authModal').classList.remove('show');

            // 显示加载
            const loadingText = currentRole === 'teacher' ? '正在登录...' : '正在验证身份...';
            document.getElementById('loadingText').innerText = loadingText;
            document.getElementById('loadingOverlay').classList.add('show');

            // 模拟后端校验
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('show');

                if (currentRole === 'teacher') {
                    handleTeacherLogin();
                } else {
                    handleParentLogin();
                }
            }, 1500);
        }

        // 老师登录逻辑
        function handleTeacherLogin() {
            if (registeredTeachers[mockPhone]) {
                // 老用户：直接登录
                const teacher = registeredTeachers[mockPhone];
                showToast(`欢迎回来，${teacher.name}`);
                setTimeout(() => {
                    window.location.href = 'teacher-home.html';
                }, 1000);
            } else {
                // 新用户：自动注册
                isNewTeacher = true;
                document.getElementById('successDesc').innerHTML =
                    '已为您创建托管机构账号<br>建议先去设置中完善机构信息';
                document.getElementById('successModal').classList.add('show');
            }
        }

        // 家长登录逻辑
        function handleParentLogin() {
            if (registeredParents[mockPhone]) {
                // 匹配成功
                const parent = registeredParents[mockPhone];
                showToast(`欢迎回来，${parent.studentName}家长`);
                setTimeout(() => {
                    window.location.href = `parent-daily.html?name=${encodeURIComponent(parent.studentName)}&id=${parent.studentId}`;
                }, 1000);
            } else {
                // 匹配失败
                document.getElementById('errorModal').classList.add('show');
            }
        }

        // 关闭错误弹窗
        function closeErrorModal() {
            document.getElementById('errorModal').classList.remove('show');
        }

        // 跳转老师首页
        function goToTeacherHome() {
            document.getElementById('successModal').classList.remove('show');
            window.location.href = 'teacher-home.html';
        }

        // Toast 提示
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }
    </script>

</body>

</html>
