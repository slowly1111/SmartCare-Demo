<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能托管助手 - 家长端</title>
    <style>
        /* --- 全局样式 --- */
        :root {
            --primary-color: #07c160;
            --bg-color: #f5f7fa;
            --text-main: #333;
            --text-sub: #999;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-shell {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 顶部装饰 */
        .header-decor {
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .logo-icon {
            font-size: 64px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
        }

        .app-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .app-slogan {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 主卡片区 */
        .main-card {
            flex: 1;
            background: #fff;
            border-radius: 24px 24px 0 0;
            padding: 30px 25px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
        }

        .welcome-text {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .welcome-sub {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        /* 角色选择卡片 */
        .role-cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .role-card {
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-card:hover {
            background: #f0f9ff;
            border-color: #1890ff;
        }

        .role-card.selected {
            background: #e6f7ff;
            border-color: var(--primary-color);
        }

        .role-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
        }

        .role-card:first-child .role-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .role-card:last-child .role-icon {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .role-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: var(--text-main);
        }

        .role-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-sub);
        }

        .role-arrow {
            margin-left: auto;
            color: #ddd;
            font-size: 18px;
        }

        /* 分隔线 */
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--text-sub);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .divider span {
            padding: 0 15px;
        }

        /* 微信授权按钮 */
        .wechat-btn {
            width: 100%;
            height: 50px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(7, 193, 96, 0.3);
            transition: all 0.3s;
        }

        .wechat-btn:active {
            transform: scale(0.98);
        }

        .wechat-btn:disabled {
            background: #ccc;
            box-shadow: none;
        }

        .wechat-icon {
            font-size: 20px;
        }

        /* 提示文字 */
        .tips {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.8;
        }

        .tips a {
            color: #576b95;
            text-decoration: none;
        }

        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-overlay.show {
            display: flex;
        }

        .bottom-sheet {
            background: #fff;
            width: 100%;
            max-width: 414px;
            border-radius: 16px 16px 0 0;
            padding: 25px 20px 40px 20px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .sheet-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .sheet-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
        }

        .sheet-title {
            flex: 1;
        }

        .sheet-title h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }

        .sheet-title p {
            margin: 0;
            font-size: 12px;
            color: var(--text-sub);
        }

        .phone-display {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn-group button {
            flex: 1;
            height: 44px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-deny {
            background: #f5f5f5;
            border: none;
            color: var(--text-main);
        }

        .btn-allow {
            background: var(--primary-color);
            border: none;
            color: #fff;
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            display: none;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-sub);
        }
    </style>
</head>

<body>

    <div id="app-shell">

        <div id="toast">提示信息</div>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在验证...</div>
        </div>

        <div class="header-decor">
            <div class="logo-icon">🎒</div>
            <div class="app-name">智能托管助手</div>
            <div class="app-slogan">让接送更安心，让学习更高效</div>
        </div>

        <div class="main-card">
            <div class="welcome-text">欢迎使用 👋</div>
            <div class="welcome-sub">请选择您的身份以继续</div>

            <div class="role-cards">
                <div class="role-card" onclick="selectRole('teacher')">
                    <div class="role-icon">👨‍🏫</div>
                    <div class="role-info">
                        <h3>我是老师</h3>
                        <p>管理班级、记录考勤、拍摄作业</p>
                    </div>
                    <span class="role-arrow">›</span>
                </div>

                <div class="role-card" onclick="selectRole('parent')">
                    <div class="role-icon">👨‍👩‍👧</div>
                    <div class="role-info">
                        <h3>我是家长</h3>
                        <p>查看孩子动态、下载作业报告</p>
                    </div>
                    <span class="role-arrow">›</span>
                </div>
            </div>

            <div class="divider"><span>家长快捷登录</span></div>

            <button class="wechat-btn" onclick="wechatAuth()">
                <span class="wechat-icon">📱</span>
                微信一键授权登录
            </button>

            <div class="tips">
                授权登录即表示您已阅读并同意<br>
                <a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
            </div>
        </div>

    </div>

    <!-- 微信授权弹窗 -->
    <div class="modal-overlay" id="authModal">
        <div class="bottom-sheet">
            <div class="sheet-header">
                <div class="sheet-icon">📱</div>
                <div class="sheet-title">
                    <h4>获取手机号</h4>
                    <p>智能托管助手申请获取你的手机号</p>
                </div>
            </div>

            <div class="phone-display" id="phoneDisplay">138****8000</div>

            <div class="btn-group">
                <button class="btn-deny" onclick="denyAuth()">拒绝</button>
                <button class="btn-allow" onclick="allowAuth()">允许</button>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据：已绑定的家长手机号
        const registeredParents = {
            '13812345678': { studentName: '王小明', studentId: 1 },
            '13800138000': { studentName: '谭圣涵', studentId: 2 },
            '13666666666': { studentName: '李梓诺', studentId: 3 }
        };

        // 当前模拟的手机号
        let mockPhone = '13800138000';

        // 选择角色
        function selectRole(role) {
            if (role === 'teacher') {
                // 老师端直接跳转
                window.location.href = 'index.html';
            } else {
                // 家长端弹出授权
                wechatAuth();
            }
        }

        // 微信授权
        function wechatAuth() {
            // 显示授权弹窗
            document.getElementById('authModal').classList.add('show');

            // 模拟显示脱敏手机号
            const maskedPhone = mockPhone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
            document.getElementById('phoneDisplay').innerText = maskedPhone;
        }

        // 拒绝授权
        function denyAuth() {
            document.getElementById('authModal').classList.remove('show');
            showToast('您已取消授权');
        }

        // 允许授权
        function allowAuth() {
            document.getElementById('authModal').classList.remove('show');

            // 显示加载
            document.getElementById('loadingOverlay').classList.add('show');

            // 模拟后端校验
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('show');

                // 检查手机号是否匹配
                if (registeredParents[mockPhone]) {
                    const parent = registeredParents[mockPhone];
                    showToast(`欢迎回来，${parent.studentName}家长`);

                    // 跳转到日报页
                    setTimeout(() => {
                        window.location.href = `parent-daily.html?name=${encodeURIComponent(parent.studentName)}&id=${parent.studentId}`;
                    }, 1000);
                } else {
                    // 匹配失败
                    showToast('未找到学生信息，请联系老师核对手机号');
                }
            }, 1500);
        }

        // Toast 提示
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        // 检查是否已登录（模拟静默登录）
        function checkLogin() {
            const cached = localStorage.getItem('smartcare_parent');
            if (cached) {
                try {
                    const data = JSON.parse(cached);
                    // 静默登录，直接跳转
                    window.location.href = `parent-daily.html?name=${encodeURIComponent(data.studentName)}&id=${data.studentId}`;
                } catch (e) {
                    // 缓存无效，显示登录页
                }
            }
        }

        // 初始化
        // checkLogin(); // 暂时注释，方便演示
    </script>

</body>

</html>
