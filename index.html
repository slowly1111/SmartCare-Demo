<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartCare MVP Demo - 导航</title>
    <style>
        :root {
            --primary-color: #07c160;
            --bg-color: #f5f7fa;
            --text-main: #333;
            --text-sub: #999;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
        }

        .section-title {
            font-size: 14px;
            color: var(--text-sub);
            margin: 25px 0 15px 0;
            padding-left: 10px;
            border-left: 3px solid var(--primary-color);
        }

        .page-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .page-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .page-card:hover {
            background: #f0f9ff;
            border-color: #1890ff;
            transform: translateX(5px);
        }

        .page-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 15px;
        }

        .teacher-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .parent-icon {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .page-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }

        .page-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-sub);
        }

        .arrow {
            margin-left: auto;
            color: #ccc;
            font-size: 18px;
        }

        .info-box {
            background: #e6f7ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
            font-size: 13px;
            color: #1890ff;
            line-height: 1.6;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="logo">🎒</div>
            <h1>智能托管助手 SmartCare</h1>
            <p class="subtitle">MVP v1.0 前端演示 Demo</p>
        </div>

        <div class="section-title">👨‍🏫 老师端页面</div>
        <div class="page-list">
            <a href="teacher-home.html" class="page-card">
                <div class="page-icon teacher-icon">🏠</div>
                <div class="page-info">
                    <h3>老师首页</h3>
                    <p>班级列表、快捷功能入口</p>
                </div>
                <span class="arrow">›</span>
            </a>

            <a href="check-in.html" class="page-card">
                <div class="page-icon teacher-icon">📋</div>
                <div class="page-info">
                    <h3>考勤工作台</h3>
                    <p>学生状态管理、一键入班</p>
                </div>
                <span class="arrow">›</span>
            </a>

            <a href="camera.html" class="page-card">
                <div class="page-icon teacher-icon">📷</div>
                <div class="page-info">
                    <h3>连拍相机</h3>
                    <p>作业拍摄、科目归档</p>
                </div>
                <span class="arrow">›</span>
            </a>

            <a href="student_profile.html" class="page-card">
                <div class="page-icon teacher-icon">👤</div>
                <div class="page-info">
                    <h3>学生档案</h3>
                    <p>信息编辑、历史报告</p>
                </div>
                <span class="arrow">›</span>
            </a>
        </div>

        <div class="section-title">👨‍👩‍👧 家长端页面</div>
        <div class="page-list">
            <a href="parent-login.html" class="page-card">
                <div class="page-icon parent-icon">🔐</div>
                <div class="page-info">
                    <h3>家长登录</h3>
                    <p>微信一键授权、角色选择</p>
                </div>
                <span class="arrow">›</span>
            </a>

            <a href="parent-daily.html" class="page-card">
                <div class="page-icon parent-icon">📅</div>
                <div class="page-info">
                    <h3>今日动态</h3>
                    <p>接送状态、作业报告下载</p>
                </div>
                <span class="arrow">›</span>
            </a>
        </div>

        <div class="info-box">
            <strong>💡 使用说明</strong>
            本Demo为纯前端演示，所有数据均为模拟数据。<br>
            推荐使用手机或浏览器开发者工具的移动端模式体验。
        </div>

        <div class="footer">
            基于 PRD v1.0 构建 · SmartCare Demo
        </div>
    </div>

</body>

</html>
