<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学生档案 - 谭圣涵</title>
    <style>
        /* --- 全局样式 --- */
        :root {
            --primary-color: #07c160;
            --bg-color: #f5f7fa;
            --text-main: #333;
            --text-sub: #999;
            --border-color: #eee;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background-color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        #app-shell {
            width: 100%;
            max-width: 414px;
            height: 100%;
            height: 100dvh;
            /* 动态视口高度，适配移动端 */
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }

        /* 顶部导航 */
        .navbar {
            height: 52px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            padding: 0 15px;
            position: sticky;
            top: 0;
            z-index: 10;
            flex-shrink: 0;
        }

        /* ... (skipping unchanged parts if possible, but replace needs context) ... */
        /* actually I will replace navbar block and btn-delete block separately to be clean */

        .back-btn {
            font-size: 18px;
            color: #333;
            margin-right: 15px;
            cursor: pointer;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }

        .nav-right-btn {
            font-size: 14px;
            color: #576b95;
            padding: 5px;
            cursor: pointer;
        }

        /* 居中修正 */

        /* 1. 个人信息卡片 (管理功能入口) */
        .profile-card {
            background: #fff;
            padding: 25px 20px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #eee;
            margin-bottom: 15px;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-image: url('https://api.dicebear.com/7.x/miniavs/svg?seed=1');
            background-size: cover;
        }

        .stu-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .class-badge {
            background: #e6f7ff;
            color: #1890ff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .stats-row {
            display: flex;
            width: 100%;
            justify-content: space-around;
            margin-top: 10px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            display: block;
        }

        .stat-lbl {
            font-size: 12px;
            color: #999;
        }

        /* 电话按钮样式 */
        .phone-action {
            display: flex;
            align-items: center;
            background-color: #f6ffed;
            /* 浅绿色背景，暗示通讯/安全 */
            border: 1px solid #b7eb8f;
            color: #52c41a;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            /* 增加一点下间距 */
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .phone-action:active {
            background-color: #d9f7be;
            transform: scale(0.98);
        }

        .phone-icon {
            margin-right: 6px;
            font-size: 14px;
        }

        /* 2. 档案列表区域 */
        .archive-section {
            flex: 1;
            background: #fff;
            padding: 0 20px;
        }

        .section-header {
            padding: 20px 0 15px 0;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-icon {
            color: #576b95;
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
            padding: 4px 8px;
            background: #f0f9ff;
            border-radius: 4px;
        }

        /* 月份选择弹窗 */
        .picker-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 200;
        }

        .picker-overlay.show {
            display: flex;
        }

        .picker-sheet {
            background: #fff;
            width: 100%;
            max-width: 414px;
            border-radius: 16px 16px 0 0;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }

        .picker-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .month-item {
            text-align: center;
            padding: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .month-item.active {
            background: var(--primary-color);
            color: #fff;
        }

        .month-item.disabled {
            color: #ccc;
            background: #fafafa;
        }

        /* 历史记录列表 - 通用组件样式 */
        .history-list {
            padding-bottom: 20px;
        }

        /* 档案卡片容器 */
        .archive-item {
            display: flex;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        /* 左侧日期 */
        .archive-date {
            width: 45px;
            text-align: center;
            margin-right: 15px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding-top: 2px;
        }

        .date-day {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            line-height: 1;
            margin-bottom: 4px;
        }

        .date-month {
            font-size: 11px;
            color: #999;
        }

        /* 右侧内容区 */
        .archive-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 1. 标题行 */
        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .archive-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }

        .comment-icon {
            font-size: 16px;
            color: #999;
            cursor: pointer;
            padding: 0 5px;
        }

        .comment-icon:active {
            color: #07c160;
        }

        /* 2. 描述行 (降级) */
        .archive-desc {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        /* 3. 标签行 (升级) */
        .archive-tags-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .tag-pill {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #eee;
            background: #fff;
            color: #666;
        }

        /* 标签状态色 */
        .tag-pill.good {
            background: #f6ffed;
            color: #52c41a;
            border-color: #b7eb8f;
        }

        .tag-pill.fast {
            background: #e6f7ff;
            color: #1890ff;
            border-color: #91d5ff;
        }

        .tag-pill.warn {
            background: #fffbe6;
            color: #faad14;
            border-color: #ffe58f;
        }

        .tag-pill.perfect {
            background: #fff0f6;
            color: #eb2f96;
            border-color: #ffadd2;
        }

        /* 4. PDF 胶囊 */
        .pdf-capsule-sm {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #666;
            background: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            width: fit-content;
            border: 1px solid #eee;
            cursor: pointer;
        }

        .pdf-capsule-sm span {
            color: #ff4d4f;
            font-weight: bold;
            margin-right: 6px;
        }

        .pdf-capsule-sm:active {
            background: #f0f0f0;
        }

        /* ====== 五层时间轴样式 ====== */
        .tl-item {
            position: relative;
            padding: 0 0 24px 50px;
        }

        .tl-item::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 10px;
            bottom: 0;
            width: 2px;
            background: #e8e8e8;
        }

        .tl-item:last-child::before {
            display: none;
        }

        .tl-dot {
            position: absolute;
            left: 10px;
            top: 4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #07c160;
            border: 3px solid #d9f7be;
        }

        .tl-dot.perfect {
            background: #faad14;
            border-color: #ffe58f;
        }

        .tl-date {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .tl-date span {
            font-weight: normal;
            color: #999;
            font-size: 12px;
            margin-left: 6px;
        }

        .tl-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 14px;
            overflow: hidden;
            /* 限制子元素宽度，触发内层 overflow-x 滚动 */
        }

        .tl-card.perfect-card {
            background: linear-gradient(135deg, #fffbe6 0%, #fff7e6 100%);
            border: 1px solid #ffe58f;
        }

        .tl-layer {
            margin-bottom: 12px;
            min-width: 0;
            /* 防止 flex 子项擑开父容器 */
        }

        .tl-layer:last-child {
            margin-bottom: 0;
        }

        .tl-layer-title {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tl-attendance {
            font-size: 13px;
            color: #52c41a;
        }

        .tl-task-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            font-size: 13px;
            color: #333;
        }

        .tl-task-row .done {
            color: #52c41a;
        }

        .tl-task-row .undone {
            color: #ff4d4f;
        }

        .tl-photos {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            /* 隐藏原生滚动条，更像 Native App 滑动体验 */
            scrollbar-width: none;
            /* Firefox */
            -webkit-overflow-scrolling: touch;
            /* 修复 iOS/移动端滑动卡顿 */
        }

        .tl-photos::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Edge */
        }

        .tl-photo-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: #ddd;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .tl-photo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tl-photo-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 10px;
            text-align: center;
            padding: 2px 0;
        }

        .tl-photo-more-btn {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: #f0f0f0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            border: 1px dashed #ccc;
        }

        .tl-photo-more-btn:active {
            background: #e6e6e6;
        }

        .tl-comment {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }

        .tl-comment::before {
            content: '👩‍🏫 ';
        }

        .tl-perfect-banner {
            text-align: center;
            font-size: 20px;
            padding: 16px;
            background: linear-gradient(135deg, #fffbe6 0%, #fff1b8 100%);
            border-radius: 8px;
            color: #d48806;
        }

        .tl-pdf-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 0;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            cursor: pointer;
        }

        .tl-pdf-btn:active {
            background: #f0f0f0;
        }

        /* 底部操作区 */

        .btn-delete {
            display: block;
            width: 100%;
            height: 44px;
            line-height: 44px;
            background: transparent;
            color: #fa5151;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid rgba(250, 81, 81, 0.3);
            margin-top: 30px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .btn-delete:active {
            background: #fff5f5;
            border-color: #fa5151;
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: #fff;
            width: 80%;
            padding: 20px;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }

        .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }

        .btn-save {
            background: var(--primary-color);
            color: #fff;
        }
    </style>
</head>

<body>

    <div id="app-shell">

        <div class="navbar">

        <div class="profile-card">

            <div class="avatar-large"></div>

            <div class="phone-action" onclick="callParent('13800138000')">
                <span class="phone-icon">📞</span>

            <div class="stats-row">
                <div class="stat-box">

                <div class="form-group">

                <div class="form-group">

                </div>

                <div style="display:flex; gap:12px; margin-top:20px;">

                    <button class="btn btn-primary" style="flex:1" onclick="saveInfo()">保存修改</button>

            </div>
        </div>

        <!-- 图片大图预览 Modal -->
        <div class="modal-overlay" id="previewModal" style="background: rgba(0,0,0,0.9); z-index: 2000;"

                </div>
                <button class="btn btn-cancel" style="width:100%" onclick="closeMonthPicker()">取消</button>
            </div>
        </div>

                    attendance: { arriveTime: '16:55', status: '正常入班' },
                    tasks: [
                        { subject: '英语', content: '单元测试卷', done: false }
                    ],
                    tags: ['龟 有点拖拉'],
                    photos: [
                        { url: 'assets/mock-photos/english1.png', subject: '英语' }
                    ],
                    comment: '',
                    isPerfect: false
                },
                {
                    date: '2026-02-18',
                    weekday: '周日',
                    attendance: null,
                    tasks: [],
                    tags: ['👍 书写工整', '⚡ 速度快', '🧠 思路清晰'],
                    photos: [
                        { url: 'assets/mock-photos/math2.png', subject: '数学' },
                        { url: 'assets/mock-photos/chinese1.png', subject: '语文' },
                        { url: 'assets/mock-photos/english1.png', subject: '英语' }
                    ],
                    comment: '今天的写字很认真，希望这种状态能继续保持。',
                    isPerfect: false
                },
                {
                    date: '2026-02-17',
                    weekday: '周六',
                    attendance: { arriveTime: '09:00', status: '正常入班' },
                    tasks: [
                        { subject: '语文', content: '读书笔记', done: true },
                        { subject: '数学', content: '口算题卡', done: true },
                        { subject: '英语', content: '录音作业', done: true }
                    ],
                    tags: ['🎉 今日全对', '👍 书写工整'],
                    photos: [],
                    comment: '',
                    isPerfect: true
                }
            ];

            /**
             * 渲染五层时间轴
             * 核心原则：某层数据为空时该层 DOM 不渲染（无感降级）
             */
            function renderTimeline() {
                const container = document.getElementById('timeline-list');
                container.innerHTML = historyRecords.map(rec => {
                    const d = new Date(rec.date);
                    const dayStr = String(d.getDate()).padStart(2, '0');
                    const monthStr = `${d.getMonth() + 1}月`;

                    // 动态组装五层
                    let layers = '';

                    // 层1: 考勤
                    if (rec.attendance) {
                        layers += `
                        <div class="tl-layer">
                            <div class="tl-layer-title">📍 入班签到</div>
                            <div class="tl-attendance">${rec.attendance.arriveTime} ${rec.attendance.status}</div>
                        </div>`;
                    }

                    // 层2: 作业清单
                    if (rec.tasks && rec.tasks.length > 0) {
                        const taskRows = rec.tasks.map(t => {
                            const icon = t.done ? '<span class="done">✅</span>' : '<span class="undone">❌</span>';
                            return `<div class="tl-task-row">${icon} ${t.subject} - ${t.content}</div>`;
                        }).join('');
                        layers += `
                        <div class="tl-layer">
                            <div class="tl-layer-title">📋 今日作业清单</div>
                            ${taskRows}
                        </div>`;
                    }

                    // 层3: 表现标签
                    if (rec.tags && rec.tags.length > 0) {
                        const tagClass = tag => {
                            if (tag.includes('全对')) return 'perfect';
                            if (tag.includes('拖拉') || tag.includes('粗心')) return 'warn';
                            if (tag.includes('速度')) return 'fast';
                            return 'good';
                        };
                        const tagHtml = rec.tags.map(t => `<span class="tag-pill ${tagClass(t)}">${t}</span>`).join('');
                        layers += `
                        <div class="tl-layer">
                            <div class="tl-layer-title">🏷️ 综合表现</div>
                            <div class="archive-tags-row">${tagHtml}</div>
                        </div>`;
                    }

                    // 层4: 错题原片 / 全对表扬
                    if (rec.isPerfect) {
                        layers += `
                        <div class="tl-layer">
                            <div class="tl-perfect-banner">🎉 今日无错题归档，表现优异！</div>
                        </div>`;
                    } else if (rec.photos && rec.photos.length > 0) {
                        const photoHtml = rec.photos.map(p => `
                        <div class="tl-photo-thumb" onclick="showPreview('${p.url}')">
                            <img src="${p.url}" alt="错题">
                            <div class="tl-photo-label">${p.subject}</div>
                        </div>`).join('');

                        layers += `
                        <div class="tl-layer">
                            <div class="tl-layer-title">📎 当日错题原片与诊断</div>
                            <div class="tl-photos">${photoHtml}</div>
                        </div>`;
                    }

                    // 层5: 老师留言
                    if (rec.comment && rec.comment.trim()) {
                        layers += `
                        <div class="tl-layer">
                            <div class="tl-layer-title">👩‍🏫 带班寄语</div>
                            <div class="tl-comment">${rec.comment}</div>
                        </div>`;
                    }

                    // 底部 PDF 按钮
                    const dateId = rec.date.replace(/-/g, '');
                    const pdfBtnHtml = !rec.isPerfect && rec.photos && rec.photos.length > 0 ? `
                    <div class="tl-layer">
                        <div class="tl-pdf-btn" onclick="previewPDF('${dateId}')">
                            🖨️ 导出/打印《今日学情诊断报告.pdf》
                        </div>
                    </div>` : '';

                    const cardClass = rec.isPerfect ? 'tl-card perfect-card' : 'tl-card';
                    const dotClass = rec.isPerfect ? 'tl-dot perfect' : 'tl-dot';

                    return `
                    <div class="tl-item">
                        <div class="${dotClass}"></div>
                        <div class="tl-date">${monthStr}${dayStr}日 <span>(${rec.weekday})</span></div>
                        <div class="${cardClass}">
                            ${layers}
                            ${pdfBtnHtml}
                        </div>
                    </div>
                `;
                }).join('');
            }

            // 初始化页面
            function init() {
                document.getElementById('display-name').innerText = studentName;
                document.getElementById('input-name').value = studentName;
                renderTimeline();
            }

            // 返回考勤工作台
            function goBack() {
                window.location.href = 'check-in.html';
            }

            function showEditModal() {
                document.getElementById('editModal').style.display = 'flex';
            }

            function closeEditModal() {
                document.getElementById('editModal').style.display = 'none';
            }

            function saveInfo() {
                const newName = document.getElementById('input-name').value;
                const newPhone = document.getElementById('input-phone').value;
                const newRelation = document.getElementById('input-relation').value;
                const classSelect = document.getElementById('input-class');
                const newClassName = classSelect.options[classSelect.selectedIndex].text;

                document.getElementById('display-name').innerText = newName;
                document.querySelector('.class-badge').innerText = newClassName;
                document.querySelector('.phone-num').innerText = newPhone + ` (${newRelation})`;
                document.querySelector('.phone-action').setAttribute('onclick', `callParent('${newPhone}')`);

                closeEditModal();
                alert(`修改成功！\n学生班级：${newClassName}\n家长联系：${newRelation} - ${newPhone}`);
            }

            // 月份筛选逻辑
            function showMonthPicker() {
                document.getElementById('monthPicker').classList.add('show');
            }

            function closeMonthPicker() {
                document.getElementById('monthPicker').classList.remove('show');
            }

            function selectMonth(m) {
                if (m > 2) return;
                closeMonthPicker();
                alert(`已切换至 ${m} 月的数据`);
            }

            function callParent(phone) {
                if (confirm(`确定要拨打家长电话吗？\n号码：${phone}`)) {
                    console.log('Calling ' + phone);
                }
            }

            function showComment(text) {
                alert('👩‍🏫 老师评语：\n\n' + text);
            }

            function previewPDF(fileId) {
                alert('正在打开: ' + fileId + '_学情诊断报告.pdf');
            }

            // 大图预览逻辑
            function showPreview(url) {
                const modal = document.getElementById('previewModal');
                const img = document.getElementById('previewImage');
                img.src = url;
                modal.style.display = 'flex';
            }

            function closePreview() {
                document.getElementById('previewModal').style.display = 'none';
            }

            // 为所有 .tl-photos 容器启用鼠标拖拽滚动 + 鼠标滚轮横向滚动
            // NOTE: 桌面端隐藏滚动条后，用户无法用鼠标原生横滑，必须用 JS 模拟
            function enableDragScroll() {
                document.querySelectorAll('.tl-photos').forEach(container => {
                    let isDown = false;
                    let startX;
                    let scrollLeft;

                    // 鼠标按下开始拖拽
                    container.addEventListener('mousedown', e => {
                        isDown = true;
                        container.style.cursor = 'grabbing';
                        startX = e.pageX - container.offsetLeft;
                        scrollLeft = container.scrollLeft;
                        e.preventDefault();
                    });

                    container.addEventListener('mouseleave', () => {
                        isDown = false;
                        container.style.cursor = 'grab';
                    });

                    container.addEventListener('mouseup', () => {
                        isDown = false;
                        container.style.cursor = 'grab';
                    });

                    container.addEventListener('mousemove', e => {
                        if (!isDown) return;
                        e.preventDefault();
                        const x = e.pageX - container.offsetLeft;
                        const walk = (x - startX) * 1.5; // 拖拽灵敏度
                        container.scrollLeft = scrollLeft - walk;
                    });

                    // 鼠标滚轮转为横向滚动
                    container.addEventListener('wheel', e => {
                        if (container.scrollWidth > container.clientWidth) {
                            e.preventDefault();
                            container.scrollLeft += e.deltaY;
                        }
                    }, { passive: false });

                    // 设置默认光标
                    container.style.cursor = 'grab';
                });
            }

            // 启动
            init();
            // 等待 DOM 渲染完毕后绑定拖拽事件
            setTimeout(enableDragScroll, 100);
        </script>

</body>
